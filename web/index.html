<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>test_platform</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:560px;margin:3rem auto;padding:0 1rem;line-height:1.6}
  form{display:flex;gap:.5rem}
  input{flex:1;padding:.5rem;font-size:1rem}
  button{padding:.5rem 1rem;font-size:1rem}
  li{padding:.25rem 0;border-bottom:1px solid #ddd}
  small{color:#666}
</style>
</head>
<body>
  <h1>ห้อง hello (ซ้อม)</h1>
  <p><small>หน้านี้คุยกับ api ผ่าน /api/hello และ api เขียนลง postgres ของเครื่องคุณ</small></p>
  <form id="f"><input id="name" placeholder="ชื่อ" required maxlength="100"><button>ทักทาย</button></form>
  <ul id="list"></ul>
  <p id="env"><small></small></p>
<script>
  const list = document.getElementById('list');
  async function load(){
    const rows = await (await fetch('/api/hello')).json();
    list.innerHTML = rows.map(r => `<li>${r.message}</li>`).join('');
    const h = await (await fetch('/api/health')).json();
    document.querySelector('#env small').textContent = 'env: ' + h.env;
  }
  document.getElementById('f').addEventListener('submit', async e => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    if(!name) return;
    await fetch('/api/hello', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({name})});
    document.getElementById('name').value = '';
    load();
  });
  load();
</script>
</body>
</html>
