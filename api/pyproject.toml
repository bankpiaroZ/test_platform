[project]
name = "app"
version = "0.0.1"
description = "test_platform rehearsal api"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.1",
  "sqlalchemy==2.0.36",
  "psycopg[binary]==3.2.3",
  "alembic==1.14.0",
  "pydantic-settings==2.6.1",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "httpx==0.27.2",
  "ruff==0.7.4",
  "import-linter==2.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Depends(...) ใน argument เป็นวิธีปกติของ FastAPI ไม่ใช่ bug
extend-immutable-calls = ["fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# กำแพงระหว่างชั้นและระหว่างห้อง — CI จับ
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "ชั้น: modules → platform → core (ห้ามย้อนกลับ)"
type = "layers"
layers = ["app.modules", "app.platform", "app.core"]

[[tool.importlinter.contracts]]
name = "ห้องห้าม import ห้องอื่น"
type = "independence"
modules = ["app.modules.hello", "app.modules.dq", "app.modules.access", "app.modules.dg"]
